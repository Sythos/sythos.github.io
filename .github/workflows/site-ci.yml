name: Static site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate static HTML and SEO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectNames = @('JS_Barcode_Universal', 'Cordiale', 'Classeviva-Dashboard', 'GuloGulo', 'bzo')
          $expectedProjectOrder = @('JS_Barcode_Universal', 'Cordiale', 'Classeviva-Dashboard', 'GuloGulo', 'bzo')
          $localeFiles = @(
            'index.html',
            'index.de_DE.html',
            'index.es_ES.html',
            'index.fr_FR.html',
            'index.it_IT.html',
            'index.ja_JP.html',
            'index.ko_KR.html',
            'index.pt_PT.html',
            'index.zh_CN.html'
          )

          if (Test-Path -LiteralPath 'projects/sythos.github.io') {
            throw 'The sythos.github.io repository must not appear in generated content.'
          }

          $hasLocalization = Test-Path -LiteralPath 'projects/JS_Barcode_Universal/index.de_DE.html'
          $requiredLocaleFiles = if ($hasLocalization) { $localeFiles } else { @('index.html') }
          foreach ($projectName in $projectNames) {
            foreach ($fileName in $requiredLocaleFiles) {
              $path = Join-Path "projects/$projectName" $fileName
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing required page: $path"
              }
            }
          }

          $homepage = Get-Content -LiteralPath 'index.html' -Raw -Encoding UTF8
          $homepageProjectOrder = @([regex]::Matches($homepage, '<h2><a href="projects/([^\"]+)/">([^<]+)</a></h2>') | ForEach-Object { $_.Groups[1].Value })
          if (($homepageProjectOrder -join ',') -ne ($expectedProjectOrder -join ',')) {
            throw "Homepage project order is incorrect: $($homepageProjectOrder -join ', ')."
          }
          if ($homepage -notmatch '<span class="project-link--unavailable">GH Pages not available</span>' -or $homepage -match 'https://sythos\.github\.io/Cordiale/' -or $homepage -notmatch 'ClasseViva Dashboard' -or $homepage -match 'BZFlag') {
            throw 'Homepage contains an invalid project entry or Pages link.'
          }

          $htmlFiles = @(Get-ChildItem -Path . -Filter '*.html' -File -Recurse | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          $expectedCount = 1 + ($projectNames.Count * $requiredLocaleFiles.Count)
          $expectedExternalSitemapCount = 46 + 20
          $expectedSitemapCount = $expectedCount + $expectedExternalSitemapCount
          if ($htmlFiles.Count -ne $expectedCount) {
            throw "Expected $expectedCount HTML files, found $($htmlFiles.Count)."
          }

          $forbidden = @('<script\b', 'javascript\s*:', '\son[a-z]+\s*=', '<iframe\b', '<object\b', '<embed\b')
          foreach ($file in $htmlFiles) {
            $content = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
            if ($content -notmatch '(?i)<!doctype html>') { throw "Missing HTML5 doctype: $($file.FullName)" }
            if ($content -notmatch '<html lang="[a-z]{2}-[A-Z]{2}"') { throw "Missing BCP 47 lang: $($file.FullName)" }
            if ($content -notmatch '<title>[^<]+</title>') { throw "Missing title: $($file.FullName)" }
            if ($content -notmatch '<meta name="description" content="[^\"]+">') { throw "Missing description: $($file.FullName)" }
            if ($content -notmatch '<meta name="robots" content="index, follow">') { throw "Missing index/follow: $($file.FullName)" }
            if ($content -notmatch '<link rel="canonical" href="https://sythos\.github\.io/[^\"]*">') { throw "Missing canonical: $($file.FullName)" }
            foreach ($pattern in $forbidden) {
              if ($content -match $pattern) { throw "Forbidden runtime content '$pattern': $($file.FullName)" }
            }
          }

          [xml]$sitemap = Get-Content -LiteralPath 'sitemap.xml' -Raw -Encoding UTF8
          $sitemapRoot = $sitemap.DocumentElement
          if ($sitemapRoot.LocalName -ne 'urlset' -or $sitemapRoot.NamespaceURI -ne 'http://www.sitemaps.org/schemas/sitemap/0.9') {
            throw 'sitemap.xml must use the standard Sitemap urlset namespace.'
          }
          $ns = [System.Xml.XmlNamespaceManager]::new($sitemap.NameTable)
          $ns.AddNamespace('sm', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          $urls = @($sitemap.SelectNodes('//sm:url', $ns))
          if ($urls.Count -ne $expectedSitemapCount) { throw "Sitemap has $($urls.Count) URLs; expected $expectedSitemapCount." }
          $locs = @($urls | ForEach-Object { [string]$_.loc })
          if (@($locs | Select-Object -Unique).Count -ne $locs.Count) { throw 'Sitemap contains duplicate loc values.' }
          $barcodeDocs = @($locs | Where-Object { $_ -match '^https://sythos\.github\.io/JS_Barcode_Universal/' })
          $guloDocs = @($locs | Where-Object { $_ -match '^https://sythos\.github\.io/GuloGulo/' })
          if ($barcodeDocs.Count -ne 46) { throw "Sitemap has $($barcodeDocs.Count) JS Barcode Pages URLs; expected 46." }
          if ($guloDocs.Count -ne 20) { throw "Sitemap has $($guloDocs.Count) GuloGulo Pages URLs; expected 20." }
          foreach ($url in $urls) {
            $elements = @($url.SelectNodes('*'))
            if (($elements | Where-Object { $_.NamespaceURI -ne 'http://www.sitemaps.org/schemas/sitemap/0.9' }).Count -ne 0) {
              throw "Sitemap entry contains a non-standard extension: $($url.loc)"
            }
            if (($elements | ForEach-Object { $_.LocalName }) -join ',' -ne 'loc,lastmod,changefreq') {
              throw "Sitemap entry must contain loc, lastmod and changefreq in standard order: $($url.loc)"
            }
            if ($url.loc -notmatch '^https://sythos\.github\.io/') { throw "Non-canonical sitemap URL: $($url.loc)" }
            if ($url.loc -match '/projects/sythos\.github\.io/') { throw 'Self repository leaked into sitemap.' }
            if ($url.changefreq -ne 'daily') { throw "Non-daily changefreq: $($url.loc)" }
            if ([string]::IsNullOrWhiteSpace([string]$url.lastmod)) { throw "Missing lastmod: $($url.loc)" }
          }

          $indexNowKey = '5d906a45176348999c9612db8d2118a0'
          $indexNowKeyPath = "$indexNowKey.txt"
          if (-not (Test-Path -LiteralPath $indexNowKeyPath -PathType Leaf)) { throw "Missing IndexNow key file: $indexNowKeyPath" }
          if ((Get-Content -LiteralPath $indexNowKeyPath -Raw -Encoding UTF8).Trim() -ne $indexNowKey) { throw 'IndexNow key file content does not match its filename.' }

          if (Get-ChildItem -Path . -Filter '*.js' -File -Recurse | Where-Object { $_.FullName -notmatch '[\\/]\.github[\\/]' -and $_.FullName -notmatch '[\\/]\.git[\\/]' }) {
            throw 'JavaScript found in the published site.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build and verify Cloudflare Pages artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'cloudflare-pages'
          node .github/scripts/build-cloudflare.mjs $outputRoot
          if ($LASTEXITCODE -ne 0) { throw 'Cloudflare Pages build failed.' }

          $expectedProjectOrder = @('JS_Barcode_Universal', 'Cordiale', 'Classeviva-Dashboard', 'GuloGulo', 'bzo')
          $homepage = Get-Content -LiteralPath (Join-Path $outputRoot 'index.html') -Raw -Encoding UTF8
          if ($homepage -notmatch '<link rel="canonical" href="https://sythos\.pages\.dev/">') {
            throw 'Cloudflare homepage canonical URL is incorrect.'
          }
          $homepageProjectOrder = @([regex]::Matches($homepage, '<h2><a href="projects/([^\"]+)/">([^<]+)</a></h2>') | ForEach-Object { $_.Groups[1].Value })
          if (($homepageProjectOrder -join ',') -ne ($expectedProjectOrder -join ',')) {
            throw "Cloudflare homepage order is incorrect: $($homepageProjectOrder -join ', ')."
          }
          $classevivaPage = Get-Content -LiteralPath (Join-Path $outputRoot 'projects/Classeviva-Dashboard/index.html') -Raw -Encoding UTF8
          if ($classevivaPage -notmatch 'assets/repos/classeviva-dashboard\.jpg' -or $classevivaPage -notmatch 'https://github\.com/Sythos/Classeviva-Dashboard') {
            throw 'Cloudflare Classeviva Dashboard page is missing its banner or repository link.'
          }
          $cordialePage = Get-Content -LiteralPath (Join-Path $outputRoot 'projects/Cordiale/index.html') -Raw -Encoding UTF8
          if ($cordialePage -notmatch 'https://github\.com/vjt/grappa-irc' -or $cordialePage -match 'https://sythos\.github\.io/Cordiale/') {
            throw 'Cloudflare Cordiale page is missing its Grappa-IRC reference or has an unverified Pages link.'
          }

          [xml]$cloudflareSitemap = Get-Content -LiteralPath (Join-Path $outputRoot 'sitemap.xml') -Raw -Encoding UTF8
          $namespace = [System.Xml.XmlNamespaceManager]::new($cloudflareSitemap.NameTable)
          $namespace.AddNamespace('sm', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          $localLocations = @($cloudflareSitemap.SelectNodes('//sm:url/sm:loc', $namespace) | ForEach-Object { $_.InnerText })
          $cordialeLocations = @($localLocations | Where-Object { $_ -match '^https://sythos\.pages\.dev/projects/Cordiale/' })
          if ($localLocations.Count -ne 46 -or $cordialeLocations.Count -ne 9) {
            throw "Cloudflare sitemap has $($localLocations.Count) local URLs and $($cordialeLocations.Count) Cordiale URLs; expected 46 and 9."
          }

          [xml]$githubPagesSitemap = Get-Content -LiteralPath (Join-Path $outputRoot 'sitemap-github.xml') -Raw -Encoding UTF8
          $githubNamespace = [System.Xml.XmlNamespaceManager]::new($githubPagesSitemap.NameTable)
          $githubNamespace.AddNamespace('sm', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          $githubLocations = @($githubPagesSitemap.SelectNodes('//sm:url/sm:loc', $githubNamespace))
          if ($githubLocations.Count -ne 66) { throw "GitHub Pages sitemap has $($githubLocations.Count) URLs; expected 66." }

      - name: Install Playwright in temporary workspace
        shell: bash
        run: |
          mkdir -p /tmp/sythos-site-ci
          cd /tmp/sythos-site-ci
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Create temporary browser tests
        shell: bash
        run: |
          cat > /tmp/sythos-site-ci/playwright.config.cjs <<'CONFIG'
          const { defineConfig, devices } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: '.',
            testMatch: 'site.ci.js',
            workers: 1,
            reporter: 'line',
            outputDir: 'playwright-results',
            use: {
              baseURL: 'http://127.0.0.1:4173',
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure'
            },
            projects: [{ name: 'chromium', use: { ...devices['Desktop Chrome'] } }]
          });
          CONFIG

          cat > /tmp/sythos-site-ci/site.ci.js <<'TEST'
          const { test, expect } = require('@playwright/test');

          const projects = ['JS_Barcode_Universal', 'Cordiale', 'Classeviva-Dashboard', 'GuloGulo', 'bzo'];
          const projectDisplayNames = ['JS_Barcode_Universal', 'Cordiale', 'ClasseViva Dashboard', 'GuloGulo', 'bzo'];
          const projectTitles = new Map([
            ['JS_Barcode_Universal', 'JS_Barcode_Universal'],
            ['Cordiale', 'Cordiale'],
            ['Classeviva-Dashboard', 'ClasseViva Dashboard'],
            ['GuloGulo', 'GuloGulo'],
            ['bzo', 'bzo'],
          ]);

          test('homepage exposes the ordered project index and verified Pages links', async ({ page }) => {
            const errors = [];
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            const response = await page.goto('/');
            expect(response.status()).toBe(200);
            await expect(page).toHaveTitle('Sythos — Open-source projects');
            await expect(page.getByRole('heading', { level: 1 })).toHaveText('Open-source systems, built in public.');
            const names = await page.locator('.project-summary h2').allTextContents();
            expect(names).toEqual(projectDisplayNames);
            await expect(page.getByText('sythos.github.io', { exact: true })).toHaveCount(0);
            const pagesLinks = page.getByRole('link', { name: /View on GH Pages/ });
            await expect(pagesLinks).toHaveCount(2);
            expect(await pagesLinks.nth(0).getAttribute('href')).toBe('https://sythos.github.io/JS_Barcode_Universal/');
            expect(await pagesLinks.nth(1).getAttribute('href')).toBe('https://sythos.github.io/GuloGulo/');
            const cordialeRow = page.locator('.project-row').nth(1);
            await expect(cordialeRow.locator('.project-link--unavailable')).toHaveText('GH Pages not available');
            await expect(cordialeRow.locator('.project-summary')).toContainText('Grappa-IRC');
            const classevivaRow = page.locator('.project-row').nth(2);
            await expect(classevivaRow.locator('.project-summary')).toContainText('Home Assistant');
            await expect(classevivaRow.locator('img')).toHaveAttribute('src', 'assets/repos/classeviva-dashboard.jpg');
            await expect(page.locator('script')).toHaveCount(0);
            expect(errors).toEqual([]);
          });

          for (const project of projects) {
            test(`${project} English page is static, indexable and accessible`, async ({ page }) => {
              const response = await page.goto(`/projects/${encodeURIComponent(project)}/`);
              expect(response.status()).toBe(200);
              await expect(page.getByRole('heading', { level: 1 })).toHaveText(projectTitles.get(project));
              expect(await page.locator('meta[name="robots"]').getAttribute('content')).toBe('index, follow');
              await expect(page.locator('script')).toHaveCount(0);
              await page.locator('summary').click();
              const languageLinks = page.locator('.language-menu a');
              const languageCount = await languageLinks.count();
              expect([1, 9]).toContain(languageCount);
              await expect(page.getByText(/by Sythos/)).toBeVisible();
              if (project === 'Cordiale') {
                await expect(page.locator('.project-description')).toContainText('not raw IRC');
                await expect(page.getByRole('link', { name: 'Grappa-IRC project' })).toHaveAttribute('href', 'https://github.com/vjt/grappa-irc');
                await expect(page.getByRole('link', { name: /Documentation/ })).toHaveCount(0);
              }
              if (project === 'Classeviva-Dashboard') {
                await expect(page.locator('.project-description')).toContainText('Home Assistant');
                await expect(page.locator('.project-logo-panel img')).toHaveAttribute('src', '../../assets/repos/classeviva-dashboard.jpg');
              }
            });
          }

          test('mobile project layout has no horizontal overflow', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('/projects/JS_Barcode_Universal/');
            const overflow = await page.locator('html').evaluate(element => element.scrollWidth > element.clientWidth);
            expect(overflow).toBe(false);
            await expect(page.getByRole('heading', { level: 1 })).toBeVisible();
          });
          TEST

      - name: Serve static site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sythos-site-http.log 2>&1 &
          echo $! > /tmp/sythos-site-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sythos-site-http.log
          exit 1

      - name: Run Playwright
        shell: bash
        run: |
          cd /tmp/sythos-site-ci
          npx playwright test --config=playwright.config.cjs

      - name: Stop static server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/sythos-site-http.pid ]]; then
            kill "$(cat /tmp/sythos-site-http.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: /tmp/sythos-site-ci/playwright-results
          if-no-files-found: ignore
          retention-days: 30
